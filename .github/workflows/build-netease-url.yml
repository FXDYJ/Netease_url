name: Build Netease URL for NAS

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the backend and frontend revisions have not changed
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - templates/index.html
      - 'static/studio*'
      - echo_discovery.py
      - .github/workflows/build-netease-url.yml
  schedule:
    - cron: '23 20 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-netease-url
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/Suxiaoqinx/Netease_url.git

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check backend and frontend revisions
        id: upstream
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force || false }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/netease-url"
          revision=$(git ls-remote --exit-code "$UPSTREAM" refs/heads/main | cut -f1)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          ui_revision="$GITHUB_SHA"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if manifest=$(docker buildx imagetools inspect --raw "$image:latest"); then
            published_revision=$(jq -r '.annotations["org.opencontainers.image.revision"] // ""' <<< "$manifest")
            published_ui=$(jq -r '.annotations["io.github.fxdyj.netease-url.frontend.revision"] // ""' <<< "$manifest")
            if [[ "$published_revision" == "$revision" && "$published_ui" == "$ui_revision" && "$FORCE_REBUILD" != "true" ]]; then
              echo "Backend $revision and frontend $ui_revision are already published."
              exit 0
            fi
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:sha-$revision-ui-$ui_revision" >> "$GITHUB_OUTPUT"

      - name: Prepare upstream backend and fork frontend
        if: steps.upstream.outputs.revision != ''
        shell: bash
        env:
          REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          git init --quiet upstream-git
          git -C upstream-git fetch --depth 1 "$UPSTREAM" "$REVISION"
          test "$(git -C upstream-git rev-parse FETCH_HEAD)" = "$REVISION"
          mkdir image-context
          git -C upstream-git -c core.autocrlf=false archive FETCH_HEAD | tar -xf - -C image-context
          rm -f image-context/cookie.txt image-context/.env

          git init --quiet frontend-git
          git -C frontend-git fetch --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          test "$(git -C frontend-git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C frontend-git -c core.autocrlf=false archive FETCH_HEAD -- \
            echo_discovery.py templates/index.html static/studio.css static/studio.js static/studio-tools.js \
            static/studio-icons.svg static/studio-mark.svg static/studio-vinyl.svg |
            tar -xf - -C image-context
          grep -Fq 'python3 main.py' image-context/entrypoint.sh
          sed -i 's/python3 main\.py/python3 echo_discovery.py/' image-context/entrypoint.sh

      - name: Enable ARM64 emulation
        if: steps.upstream.outputs.revision != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.revision != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push the revision tag
        if: steps.upstream.outputs.revision != ''
        shell: bash
        env:
          CANDIDATE: ${{ steps.upstream.outputs.candidate }}
          REVISION: ${{ steps.upstream.outputs.revision }}
        run: |
          docker buildx build image-context \
            --platform linux/amd64,linux/arm64 \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:io.github.fxdyj.netease-url.frontend.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "io.github.fxdyj.netease-url.frontend.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$CANDIDATE" \
            --push

      - name: Start both architectures and promote latest
        if: steps.upstream.outputs.revision != ''
        shell: bash
        env:
          IMAGE: ${{ steps.upstream.outputs.image }}
          CANDIDATE: ${{ steps.upstream.outputs.candidate }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            container=$(docker run --detach --pull always --platform "$platform" \
              --publish 127.0.0.1:15000:5000 "$CANDIDATE")
            trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
            docker exec "$container" sh -ec '
              test ! -e /app/cookie.txt
              test ! -e /app/.env
              ffmpeg -version >/dev/null
            '
            origin=http://127.0.0.1:15000
            health=$(curl --fail --silent --show-error --connect-timeout 2 --max-time 5 \
              --retry 12 --retry-delay 1 --retry-all-errors "$origin/health")
            jq -e '.success and .data.service == "running"' <<< "$health"
            for path in 'similar?id=invalid' 'artist?id=invalid' 'catalog?kind=invalid' 'discover?category=invalid' 'tracks?ids=invalid'; do
              status=$(curl --silent --show-error --output /tmp/discovery.json --write-out '%{http_code}' "$origin/api/$path")
              test "$status" = 400
              jq -e '.success == false' /tmp/discovery.json
            done
            home=$(curl --fail --silent --show-error "$origin/")
            grep -Fq '/static/studio.js' <<< "$home"
            for asset in studio.js studio-tools.js studio.css studio-icons.svg studio-mark.svg studio-vinyl.svg; do
              curl --fail --silent --show-error --output /dev/null "$origin/static/$asset"
            done
            echo "$platform: server startup, health, frontend and FFmpeg checks passed"
            docker rm -f "$container" >/dev/null
            trap - EXIT
          done

          docker buildx imagetools create --tag "$IMAGE:latest" "$CANDIDATE"
          printf 'Published %s and %s.\n' "$IMAGE:latest" "$CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
